[package]
name = "router-tui"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Terminal control dashboard for the local AI router"
publish = false

[[bin]]
name = "router-tui"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = "0.3"
ratatui = "0.30"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["parsing"] }
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }

[profile.release]
lto = "thin"
strip = true

[dev-dependencies]
portable-pty = "0.9.0"
